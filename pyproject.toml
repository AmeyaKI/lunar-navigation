[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lunarnav"
version = "0.2.0"
description = "Distill MiDaS geometry into an RGB-only ResNet18 for lunar rock crops"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "kagglehub>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lunarnav*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
